# CI: lint and every test layer that needs no GPU, API key or downloaded data (Implementation Plan, Testing policy).
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check fqsel tests
      - name: Unit, schema, stats and tiny end-to-end tests
        run: pytest -q
